# The golden set for `python -m digest eval`.
#
# Whoever wrote a trap fixture wrote the assertion that catches it, in the same sitting, so
# the two cannot drift apart. Every substring below was copied out of the fixture it names
# and the test in tests/test_traps_fixtures.py proves it is still there.
#
# Every trap lands in week 2026-W37. The fixtures live under data/mock/traps/ and are never
# regenerated by `make data`.

schema_version: "1.0.0"
week: 2026-W37

# Five client claims the digest must carry, each with the exact place it came from.
# expected_verbatim_substring is an exact substring of the planted client sentence, so a
# checker can assert containment without normalising anything.
must_appear:
  - id: T1a
    trap: T1
    theme_key: renewal_invoice_credit
    file: data/mock/traps/gong/calls/7782934451002.json
    source: gong
    source_id: "7782934451002"
    expected_verbatim_substring: "missing the balance that carried over from the previous period"
    expected_account_id: ACC-0001
    expected_account_type: customer
    expected_speaker_side: client
    speaker_id: "4521"
    start_ms: 681342

  - id: T1b
    trap: T1
    theme_key: renewal_invoice_credit
    file: data/mock/traps/salesforce/cases/5008W00002aQpLrQAK.json
    source: salesforce
    source_id: "5008W00002aQpLrQAK"
    expected_verbatim_substring: "billed the whole annual figure again with nothing knocked off"
    expected_account_id: ACC-0003
    expected_account_type: customer
    expected_speaker_side: client
    comment_id: "00a8W00000XfT2mQAF"

  - id: T2a
    trap: T2
    theme_key: event_checkin_kiosk
    file: data/mock/traps/gong/calls/7782934451118.json
    source: gong
    source_id: "7782934451118"
    expected_verbatim_substring: "we need event check-in to keep running on the tablets"
    expected_account_id: ACC-0002
    expected_account_type: customer
    expected_speaker_side: client
    speaker_id: "4631"
    start_ms: 766534

  - id: T2b
    trap: T2
    theme_key: event_checkin_kiosk
    file: data/mock/traps/gong/calls/7782934451207.json
    source: gong
    source_id: "7782934451207"
    expected_verbatim_substring: "the attendee kiosk has to carry on signing people in"
    expected_account_id: ACC-0004
    expected_account_type: customer
    expected_speaker_side: client
    speaker_id: "4744"
    start_ms: 458202

  - id: T3
    trap: T3
    theme_key: lms_scorm_support
    file: data/mock/traps/gong/calls/7782934451311.json
    source: gong
    source_id: "7782934451311"
    expected_verbatim_substring: "upload SCORM 1.2 and SCORM 2004 packages straight into the learning module"
    expected_account_id: ACC-0007
    expected_account_type: prospect
    expected_speaker_side: client
    speaker_id: "4852"
    start_ms: 643260

# Two sentences that exist in the raw fixtures and must never reach any output: not a claim,
# not the digest, not a proposal, not the audit log. Both are present in the fixture on
# purpose, which is what makes the control demonstrable rather than asserted.
must_not_appear:
  - id: T4a
    trap: T4
    reason: Private support comment. The connector filters IsPublished false, so the reader agent never receives it.
    file: data/mock/traps/salesforce/cases/5008W00002aQpLrQAK.json
    source: salesforce
    source_id: "5008W00002aQpLrQAK"
    comment_id: "00a8W00000XfT2pQAF"
    forbidden_substring: "this account is a churn risk if the invoice thing drags on"

  - id: T4c
    trap: T4
    reason: Spoken by a Momentive Software account executive, so speaker_side is momentive and it is not a client claim.
    file: data/mock/traps/gong/calls/7782934451119.json
    source: gong
    source_id: "7782934451119"
    speaker_id: "1201"
    start_ms: 540016
    forbidden_substring: "A lot of our customers ask for this."

# The four planted values, verbatim. None of them may appear in any file in the store
# repository, the audit log included.
pii_must_not_appear:
  - kind: email
    value: "dana.whitfield@example.net"
  - kind: phone
    value: "(612) 555-0147"
  - kind: address
    value: "4821 Larkspur Lane, Duluth, MN 55803"
  - kind: name
    value: "Harold Pemberton-Vance"

# The seven structural assertions. `check.name` is the function a checker implements; the
# remaining keys are its arguments, so nothing has to be reread out of this comment.
structural:
  - id: S1
    description: Every claim in the digest carries a citation, and every citation resolves to the mock source it names.
    check:
      name: every_claim_cited_and_resolves

  - id: S2
    description: The two T1 claims, worded completely differently, are attached to exactly one theme between them.
    check:
      name: t1_single_theme
      source_ids:
        - "7782934451002"
        - "5008W00002aQpLrQAK"

  - id: S3
    description: The T2 theme carries both product names in its aliases, so the reconciliation is visible rather than implied.
    check:
      name: t2_aliases_both_names
      names:
        - "event check-in"
        - "attendee kiosk"

  - id: S4
    description: T3 is classified prospect and ranks below every customer backed theme of equal claim count, while still appearing in the digest.
    check:
      name: t3_prospect_ranks_below_customers
      account_id: ACC-0007
      source_id: "7782934451311"

  - id: S5
    description: No planted PII value appears in any file in the store repository, including the audit log.
    check:
      name: no_pii_in_store
      values:
        - "dana.whitfield@example.net"
        - "(612) 555-0147"
        - "4821 Larkspur Lane, Duluth, MN 55803"
        - "Harold Pemberton-Vance"

  - id: S6
    description: A second build on the same input produces the same theme ids.
    check:
      name: rerun_same_theme_ids
      week: 2026-W37
      build_run_id: "2026-09-14T07:00Z"

  - id: S7
    description: The stale evidence flag fires on the W39 digest for the one theme that received nothing for two weeks.
    check:
      name: stale_flag_fires_w39
      week: 2026-W39
      build_run_id: "2026-09-28T07:00Z"
      theme_key: dues_notice_deliverability

# Report the number whatever it is. A measured imperfection reads as engineering.
stability:
  metric: jaccard_claim_to_theme
  expect: 1.0
  report_if_lower: true
