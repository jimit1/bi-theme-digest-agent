# Exclusive file ownership for the parallel build.
#
# Exactly one task may write any given path. Two agents writing one file is how a parallel
# build corrupts itself, so this map is enforced before dispatch and no path appears twice.
# Paths are globs relative to the repository named in `repo`.
#
#   repo: code   ->  bi-theme-digest-agent/
#   repo: store  ->  bi-theme-digest-store/
#
# Reading is separate from writing: a worker may read `contracts/**` and
# `build/COMMON_RULES.md` always, and whatever else its own brief lists. Nothing else.

schema_version: "1.0.0"

conventions:
  unlisted_is_unowned: >
    A path that appears in no entry below is unowned. A worker that needs one stops and
    reports a contract conflict rather than claiming it.
  tests: >
    Every task writes tests ONLY in the file its entry names. A task with no test file in
    its paths writes no tests.
  store_repo: >
    B6 owns the store scaffold, that is the files that exist before any run. B16 owns
    everything a run produces. No other task writes to the store repository at all.
  reserved: >
    .git in either repository, and the build/ directory under the build root, belong to the
    orchestrator. No worker touches them, and no worker runs git commit.

