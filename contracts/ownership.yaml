# Paths in the section 12 layout that the roster did not name, assigned here so nothing is
# unowned at integration time. Each is called out in the B1 envelope assumptions.
inferred_assignments:
  - path: walkthrough.md
    owner: B19
    why: It is the reader facing companion to the README and the same writer should keep one voice across both.
  - path: config/build_models.yaml
    owner: B8
    why: Build time tier map. It is scaffolding for the build roster, not runtime configuration, so it sits with the scaffolding task rather than with the runtime router.
  - path: config/build_models.cheap.yaml
    owner: B8
    why: Same reason.
  - path: tests/conftest.py
    owner: B8
    why: Shared test fixtures are scaffolding. No other task may write it, so a task needing a fixture puts it in its own test file.
  - path: data/mock/salesforce/users.json
    owner: B2
    why: Already covered by the data/mock/salesforce/** glob. Called out because the file itself is an addition this pack made, to resolve the side of a case comment author.
  - path: bi-theme-digest-store/README.md and .gitignore
    owner: B6
    why: Part of the store scaffold. The store repository contains no code, so these are the only two non content files in it.
